<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLS Decoder v3</title>
<!-- DLS Decoder v3 -->
<style>
:root{--bg:#0b0e14;--panel:#121722;--panel2:#181f2d;--line:#242d3f;--text:#e9eef7;--mute:#8a96ab;--a:#7c9cff;--b:#b18cff;--ok:#42d392;--bad:#ff6b7a;--warn:#f0a24b;--r:16px;--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 500px at 15% -10%,#1b2447 0,transparent 60%),radial-gradient(700px 400px at 100% 0,#2a1b47 0,transparent 55%),var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:28px 16px 60px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.9rem;letter-spacing:-.02em;font-weight:700}
.sub{color:var(--mute);margin:6px 0 24px;font-size:.95rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.drop{border:1.5px dashed #34405a;border-radius:var(--r);padding:34px 16px;text-align:center;cursor:pointer;transition:.2s;background:var(--panel2)}
.drop:hover,.drop.over{border-color:var(--a);background:#1a2340}
.drop b{display:block;font-size:1.05rem;margin-bottom:4px}.drop span{color:var(--mute);font-size:.85rem}
.ah{display:flex;gap:10px;align-items:center;justify-content:space-between}
.an{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.badge{font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.badge.lock{color:var(--warn);border-color:var(--warn)}.badge.open{color:var(--ok);border-color:var(--ok)}
.hint{color:var(--mute);font-size:.8rem;margin-top:4px}
.kfrow{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:8px 12px;font-size:.82rem;font-weight:600;cursor:pointer}.mini:hover{border-color:var(--a)}
.pwrow{display:flex;gap:8px;margin-top:14px}
.pwrow input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--text);font-size:.95rem}
.pwrow input:focus{outline:2px solid var(--a);border-color:transparent}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:.9rem;color:#0b0e14;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b));white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.1)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:.78rem;border-radius:9px}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.files{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.f{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.f.done{border-color:#1f5b44}
.f .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.f .s{color:var(--mute);font-size:.78rem;white-space:nowrap}
.actions{display:flex;gap:8px;margin-top:12px;justify-content:space-between;align-items:center}
.prog{display:none;margin-top:14px}
.prog .top{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mute);gap:8px}
.prog .top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog .bg{height:8px;background:var(--line);border-radius:8px;margin-top:6px;overflow:hidden}
.prog .bg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .15s}
.msg{margin-top:12px;font-size:.88rem;display:none;padding:10px 12px;border-radius:10px}
.msg.ok{display:block;background:#12281f;color:var(--ok)}.msg.bad{display:block;background:#2b141a;color:var(--bad)}
.save{display:block;margin-top:8px;padding:11px 14px;border:1px solid var(--a);border-radius:12px;color:var(--a);text-decoration:none;font-weight:600;font-size:.9rem;word-break:break-all}
.hide{display:none!important}
footer{color:var(--mute);font-size:.75rem;text-align:center;margin-top:24px}

/* v3 fluid layout */
html{scroll-behavior:smooth;scroll-padding:12px 0 96px;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{min-height:100dvh;padding:clamp(14px,4vw,28px) max(clamp(12px,4vw,16px),env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) max(clamp(12px,4vw,16px),env(safe-area-inset-left))}
h1{font-size:clamp(1.5rem,6vw,1.9rem);display:flex;align-items:center;gap:10px}
.ver{font-size:.7rem;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:2px 9px;letter-spacing:0}
.sub{margin:4px 0 18px;font-size:.9rem}
.card{padding:14px;margin-bottom:12px}
.drop{padding:22px 12px}.drop b{font-size:1rem}
input,button{font-family:inherit}
.pw input,.pwrow input{font-size:16px}
.mini{min-height:40px}
footer{margin-top:16px}
.btn{min-height:44px}.btn.sm{min-height:36px}
.pwrow input{min-height:44px}.f{padding:9px 10px}
.kfrow .kname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>DLS Decoder <span class="ver">v3</span></h1>
  <p class="sub">Open and restore .dls archives</p>
  <div class="card">
    <div class="drop" id="drop"><b>Add .dls files</b><span>Tap or drop here</span></div>
    <input type="file" id="inp" multiple hidden>
  </div>
  <div id="list"></div>
  <footer>DLS Decoder v3</footer>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const fmt = b => b >= 1073741824 ? (b/1073741824).toFixed(2)+' GB' : (b/1048576).toFixed(b<1048576?3:1)+' MB';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const reveal = el => { try { el.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); } catch {} };

/* ---------- Crypto / compression ---------- */
async function pbkdf(pw, salt, iter, alg, usage, kf) {
  let m = enc.encode(pw);
  if (kf) { // password + 0x00 + SHA-256(key file)
    const h = new Uint8Array(await crypto.subtle.digest('SHA-256', kf)), x = new Uint8Array(m.length + 33);
    x.set(m); x.set(h, m.length + 1); m = x;
  }
  const km = await crypto.subtle.importKey('raw', m, 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, km, {name:alg, length:256}, false, [usage]);
}
async function cbcDec(dataB64, pw, saltB64, ivB64) { // legacy v1
  const key = await pbkdf(pw, b64(saltB64), 600000, 'AES-CBC', 'decrypt');
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC', iv:b64(ivB64)}, key, b64(dataB64)));
}
async function kfId(b) {
  if (!window.crypto?.subtle) return '?';
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', b));
  return Array.from(h.slice(0, 4), x => x.toString(16).padStart(2, '0')).join('');
}
async function gunzip(u8) {
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
}

/* ---------- Reading archives ---------- */
async function openArchive(file) {
  const head = new Uint8Array(await file.slice(0, 26).arrayBuffer());
  if (dec.decode(head.subarray(0, 4)) === 'DLS2') {
    const v = new DataView(head.buffer), fl = v.getUint8(5);
    return {file, kind:'v2', enc:(fl & 3) !== 0, kf:(fl & 2) !== 0, iter:v.getUint32(6), salt:head.slice(10, 26), files:null};
  }
  let c; // legacy JSON container
  try { c = JSON.parse(await file.text()); } catch { throw new Error('Not a valid DLS file.'); }
  if (c.chunked === true && Array.isArray(c.chunks) && c.chunks.length) {
    return {file, kind:'legacy', c, enc:c.encryptedMeta === true || c.chunks.some(x => x.encrypted), files:null};
  }
  if (c.data && c.fileName !== undefined) { // oldest single-blob form
    c = {encryptedMeta:false, meta:{fileName:c.fileName, fileType:c.fileType, fileSize:c.fileSize}, chunks:[{encrypted:!!c.encrypted, salt:c.salt, iv:c.iv, data:c.data}]};
    return {file, kind:'legacy', c, enc:c.chunks[0].encrypted, files:null};
  }
  throw new Error('Unrecognized DLS format.');
}

async function openRec(a, start, len, seq) {
  const p = new Uint8Array(await a.file.slice(start, start + len).arrayBuffer());
  if (!a.enc) return p;
  const aad = new Uint8Array(4); new DataView(aad.buffer).setUint32(0, seq);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:p.slice(0, 12), additionalData:aad}, a.key, p.subarray(12)));
}

async function unlock(a, pw, kf) {
  if (a.kind === 'v2') {
    if (a.enc) a.key = await pbkdf(pw, a.salt, a.iter, 'AES-GCM', 'decrypt', a.kf ? kf : null);
    const files = []; let off = 26, seq = 0, cur = null, ended = false;
    while (off < a.file.size && !ended) {
      const h = new DataView(await a.file.slice(off, off + 5).arrayBuffer());
      const type = h.getUint8(0), len = h.getUint32(1), start = off + 5; off = start + len;
      if (off > a.file.size) throw new Error('Archive is incomplete.');
      if (type === 1) { cur = JSON.parse(dec.decode(await openRec(a, start, len, seq))); cur.chunks = []; files.push(cur); }
      else if (type === 2 && cur) cur.chunks.push({start, len, seq});
      else if (type === 255) ended = true;
      seq++;
    }
    if (!ended) throw new Error('Archive is incomplete.');
    files.forEach(f => f.gen = async function*() {
      for (const ch of f.chunks) {
        const p = await openRec(a, ch.start, ch.len, ch.seq);
        yield p[0] === 1 ? await gunzip(p.subarray(1)) : p.subarray(1);
      }
    });
    a.files = files;
  } else {
    const c = a.c;
    const meta = c.meta || JSON.parse(dec.decode(c.encryptedMeta ? await cbcDec(c.metaData, pw, c.metaSalt, c.metaIv) : b64(c.metaData)));
    a.files = [{name:meta.fileName, type:meta.fileType, size:meta.fileSize, gen: async function*() {
      for (const ch of c.chunks) {
        let u = ch.encrypted ? await cbcDec(ch.data, pw, ch.salt, ch.iv) : b64(ch.data);
        if (u[0] === 0x1f && u[1] === 0x8b) u = await gunzip(u);
        yield u;
      }
    }}];
  }
}

/* ---------- Writing files ---------- */
const safe = n => (n || 'file').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_');
function blobWriter(name, type, save) {
  let parts = [], n = 0;
  return {
    write: async u => { parts.push(u); if (++n % 8 === 0) parts = [new Blob(parts)]; },
    close: async () => { // also leaves a visible Save link, in case the browser blocks automatic downloads
      const blob = new Blob(parts, {type:type || 'application/octet-stream'});
      save(name, URL.createObjectURL(blob), blob.size).click();
    },
    abort: async () => { parts = []; }
  };
}
const fsWriter = async h => { const w = await h.createWritable(); return {write:u => w.write(u), close:() => w.close(), abort:() => w.abort().catch(() => {})}; };

async function extract(a, list, ui) {
  let dir = null, single = null; // pickers must open straight from the tap
  try {
    if (list.length > 1 && window.showDirectoryPicker) dir = await window.showDirectoryPicker({mode:'readwrite'});
    else if (list.length === 1 && window.showSaveFilePicker) single = await window.showSaveFilePicker({suggestedName:safe(list[0].name)});
  } catch (e) { if (e.name === 'AbortError') return; throw e; }
  const total = list.reduce((s, f) => s + (f.size || 0), 0) || 1, used = new Set(); let done = 0, viaLinks = false;
  ui.busy(true);
  try {
    for (const f of list) {
      let name = safe(f.name), i = 1;
      while (used.has(name)) { const d = name.lastIndexOf('.'); name = d > 0 ? name.slice(0, d) + ` (${i})` + name.slice(d) : name + ` (${i})`; i++; }
      used.add(name);
      let w;
      if (single) w = await fsWriter(single);
      else if (dir) w = await fsWriter(await dir.getFileHandle(name, {create:true}));
      else { w = blobWriter(name, f.type, ui.save); viaLinks = true; }
      try {
        for await (const u8 of f.gen()) { await w.write(u8); done += u8.length; ui.prog(name, done / total * 100); }
        await w.close(); f._done = true; ui.mark();
      } catch (e) { await w.abort(); throw e; }
      if (viaLinks) await new Promise(r => setTimeout(r, 300));
    }
    ui.prog('Done', 100);
    ui.msg((list.length === 1 ? 'Restored ' + safe(list[0].name) + '.' : 'Restored ' + list.length + ' files.') + (viaLinks ? ' Tap Save below if nothing downloaded.' : ''), 'ok');
  } catch (e) {
    console.error(e);
    ui.msg(e.name === 'OperationError' ? (a.kind === 'v2' ? 'Part of this archive is damaged or was changed.' : 'Wrong password or damaged data.') : 'Failed: ' + (e.message || e), 'bad');
  } finally { ui.busy(false); }
}

/* ---------- UI ---------- */
function addCard(a) {
  const el = document.createElement('div'); el.className = 'card';
  el.innerHTML = `<div class="ah"><div class="an"></div><span class="badge"></span></div><div class="hint info"></div>
  <div class="kfrow hide"><button class="mini kbtn" type="button">Key file</button><span class="hint kname" style="margin:0">None chosen</span></div><input type="file" class="kin" hidden>
  <div class="pwrow"><input type="password" placeholder="Password" autocomplete="new-password"><button class="btn unl">Unlock</button></div>
  <div class="files"></div>
  <div class="actions hide"><span class="hint cnt"></span><button class="btn all">Extract all</button></div>
  <div class="prog"><div class="top"><span class="pl"></span><span class="pp"></span></div><div class="bg"><i></i></div></div><div class="msg"></div><div class="saves"></div>`;
  const q = s => el.querySelector(s);
  q('.an').textContent = a.file.name;
  q('.info').textContent = fmt(a.file.size) + (a.kind === 'legacy' ? ' · legacy' : '') + (a.kf ? ' · key file' : '');
  const badge = q('.badge'), pw = q('input[type=password]');
  let kfBytes = null;
  const msg = (t, k) => { const m = q('.msg'); m.textContent = t; m.className = 'msg ' + k; reveal(m); };
  const ui = {
    msg,
    prog: (l, p) => { if (q('.prog').style.display !== 'block') { q('.prog').style.display = 'block'; reveal(q('.prog')); } q('.pl').textContent = l; q('.pp').textContent = Math.round(p) + '%'; q('.bg i').style.width = p + '%'; },
    busy: b => { if (b) q('.msg').className = 'msg'; el.querySelectorAll('button').forEach(x => x.disabled = b); },
    mark: () => showFiles(),
    save: (name, url, size) => {
      const l = document.createElement('a'); l.href = url; l.download = name; l.className = 'save';
      l.textContent = '⬇ Save: ' + name + ' (' + fmt(size) + ')'; q('.saves').appendChild(l); reveal(l); return l;
    }
  };
  function showFiles() {
    badge.textContent = 'Unlocked'; badge.className = 'badge open';
    q('.pwrow').classList.add('hide'); q('.kfrow').classList.add('hide'); q('.actions').classList.toggle('hide', a.files.length < 2);
    q('.cnt').textContent = a.files.length + ' files · ' + fmt(a.files.reduce((s, f) => s + (f.size || 0), 0));
    const box = q('.files'); box.innerHTML = '';
    a.files.forEach(f => {
      const d = document.createElement('div'); d.className = 'f' + (f._done ? ' done' : '');
      d.innerHTML = `<span>${f._done ? '✅' : '📄'}</span><span class="n"></span><span class="s">${fmt(f.size || 0)}</span><button class="btn sm ghost">Extract</button>`;
      d.querySelector('.n').textContent = f.name;
      d.querySelector('button').onclick = () => extract(a, [f], ui);
      box.appendChild(d);
    });
  }
  async function doUnlock() {
    if (a.kf && !kfBytes) { msg('Pick the key file.', 'bad'); return; }
    if (a.enc && !a.kf && !pw.value) { msg('Enter the password.', 'bad'); return; }
    if (a.enc && !window.crypto?.subtle) { msg('Needs a secure (https) page.', 'bad'); return; }
    ui.busy(true);
    const ub = q('.unl'); ub.textContent = 'Unlocking…'; msg('Unlocking…', 'ok');
    await new Promise(r => setTimeout(r, 50));
    try { await unlock(a, pw.value, kfBytes); q('.msg').className = 'msg'; showFiles(); }
    catch (e) {
      console.error(e);
      msg(a.enc && !/incomplete/.test(e.message) ? (a.kf ? 'Wrong password, key file, or damaged file.' : 'Wrong password or damaged file.') : e.message, 'bad');
    }
    finally { ub.textContent = 'Unlock'; ui.busy(false); if (a.files) showFiles(); }
  }
  if (a.kf) q('.kfrow').classList.remove('hide');
  q('.kbtn').onclick = () => q('.kin').click();
  q('.kin').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    kfBytes = new Uint8Array(await f.arrayBuffer()); q('.kname').textContent = f.name + ' · Key ID ' + await kfId(kfBytes);
  };
  if (a.enc) { badge.textContent = 'Locked'; badge.className = 'badge lock'; } else { q('.pwrow').classList.add('hide'); doUnlock(); }
  q('.unl').onclick = doUnlock;
  pw.onkeydown = e => { if (e.key === 'Enter') doUnlock(); };
  q('.all').onclick = () => extract(a, a.files, ui);
  $('list').appendChild(el); reveal(el);
}

async function load(files) {
  for (const f of files) {
    if (!/\.dls$/i.test(f.name)) continue;
    try { addCard(await openArchive(f)); }
    catch (e) {
      const el = document.createElement('div'); el.className = 'card';
      el.innerHTML = '<div class="an"></div><div class="msg bad" style="display:block"></div>';
      el.firstChild.textContent = f.name; el.lastChild.textContent = e.message; $('list').appendChild(el);
    }
  }
}
$('drop').onclick = () => $('inp').click();
$('inp').onchange = e => { load(Array.from(e.target.files)); e.target.value = ''; };
['dragenter','dragover'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => load(Array.from(e.dataTransfer.files)));

/* ---------- Scroll memory ---------- */
try {
  const KEY = 'dls_dec_scroll', saved = parseInt(localStorage.getItem(KEY), 10);
  if (saved > 0) { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; requestAnimationFrame(() => scrollTo(0, saved)); }
  let t = 0;
  addEventListener('scroll', () => { if (t) return; t = requestAnimationFrame(() => { t = 0; try { localStorage.setItem(KEY, String(Math.round(scrollY))); } catch {} }); }, {passive:true});
} catch {}
console.log('DLS Decoder v3');
})();
</script>
</body>
</html>
